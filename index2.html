<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="News Quant">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0c1412">
    <title>News-First Quant</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css?v=14">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <div class="hero-top">
            <p class="eyebrow" data-i18n="eyebrow">Live news-first quant predictor</p>
            <div class="language-toggle" aria-label="Language">
              <button class="lang active" data-lang="en" type="button">EN</button>
              <button class="lang" data-lang="ko" type="button">KR</button>
            </div>
          </div>
          <h1>News-First Quant</h1>
          <p class="subcopy" data-i18n="subcopy">Uses the same news-first logic: live headlines, technical setup, fundamentals, and Monte Carlo risk.</p>
        </div>
        <div class="market-strip" aria-label="Signal weights">
          <span>News 55%</span>
          <span>Tech 20%</span>
          <span>Fund 12%</span>
          <span>MC 13%</span>
        </div>
      </section>

      <section class="panel controls" aria-label="Analyzer controls">
        <div class="segmented" role="tablist" aria-label="Mode">
          <button class="segment active" data-mode="specific" data-i18n="specificMode" type="button">Ticker Analysis</button>
          <button class="segment" data-mode="scan" data-i18n="scanMode" type="button">News Scan</button>
        </div>

        <label class="field" id="tickerField">
          <span data-i18n="tickerLabel">Tickers</span>
          <input id="tickers" autocomplete="off" autocapitalize="characters" spellcheck="false" value="NVDA, AAPL, RKLB">
        </label>

        <label class="field compact">
          <span data-i18n="limitLabel">Max stocks</span>
          <input id="limit" type="number" min="1" max="20" value="5">
        </label>

        <button id="analyze" class="primary" type="button">
          <span class="button-label" data-i18n="analyzeButton">Analyze</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="macro" class="macro"></section>
      <section id="results" class="results"></section>
    </main>
    <script src="/config.js?v=14"></script>
    <script src="/app.js?v=14"></script>
  </body>
</html>
